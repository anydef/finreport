type Account {
	id: UUID!
	"""
	`"comdirect"`.
	"""
	source: String!
	externalId: String!
	displayId: String
	accountType: String
	iban: String
	bic: String
	institute: String
	"""
	Login label, display only.
	"""
	label: String
	currency: String!
	latestBalance: Balance
}

type Balance {
	date: Date!
	amount: Decimal!
	currency: String!
}

type CashflowBucket {
	"""
	Inclusive.
	"""
	start: Date!
	"""
	Inclusive.
	"""
	end: Date!
	"""
	Sum of `amount > 0`, positive.
	"""
	income: Decimal!
	"""
	Sum of `|amount|` for `amount < 0`, positive.
	"""
	spending: Decimal!
	"""
	`income - spending`.
	"""
	net: Decimal!
	transactionCount: Int!
}

"""
`CATEGORY` (iteration 2) and `TAG` (iteration 3) are reserved: declared,
rejected until implemented, so an old server never silently returns a
graph it did not build (§5).
"""
enum CashflowDimension {
	INCOME_SOURCE
	ACCOUNT
	OUTCOME
	CATEGORY
	TAG
}

type CashflowGraph {
	nodes: [CashflowNode!]!
	links: [CashflowLink!]!
	currency: String!
	"""
	Echoes what the server applied.
	"""
	dimensions: [CashflowDimension!]!
	truncated: Boolean!
}

input CashflowGraphInput {
	"""
	Left-to-right dimensions. Iteration 1 accepts only the default and
	errors otherwise.
	"""
	dimensions: [CashflowDimension!]! = [INCOME_SOURCE, ACCOUNT, OUTCOME]
	"""
	Remainder folded into one `Other` node.
	"""
	maxNodesPerDimension: Int! = 8
}

type CashflowLink {
	sourceId: ID!
	targetId: ID!
	"""
	Always positive.
	"""
	value: Decimal!
}

type CashflowNode {
	"""
	Opaque, stable within one response.
	"""
	id: ID!
	label: String!
	kind: CashflowNodeKind!
	"""
	Column index; the server lays out, not the client.
	"""
	depth: Int!
	"""
	`max(inflow, outflow)`.
	"""
	value: Decimal!
	"""
	e.g. `"account"` | `"category"` — null for synthetic nodes.
	"""
	refType: String
	"""
	Id within `refType`, for drill-down.
	"""
	refId: String
}

enum CashflowNodeKind {
	INCOME_SOURCE
	ACCOUNT
	SPENDING
	NET
	DEFICIT
	OTHER
	CATEGORY
	TAG
}

type CashflowSummary {
	buckets: [CashflowBucket!]!
	total: CashflowTotals!
	currency: String!
}

type CashflowTotals {
	income: Decimal!
	spending: Decimal!
	net: Decimal!
	transactionCount: Int!
}

type Category {
	id: UUID!
	slug: String!
	name: String!
	kind: CategoryKind!
	parentId: UUID
	depth: Int!
	archived: Boolean!
	"""
	`"seed"` | `"user"` (§3).
	"""
	origin: String!
}

type CategoryBreakdown {
	rows: [CategoryBreakdownRow!]!
	"""
	Label missing entirely.
	"""
	uncategorized: CategoryBreakdownRow
	"""
	Held; counted separately, never as spend.
	"""
	needsReview: CategoryBreakdownRow
	currency: String!
}

type CategoryBreakdownRow {
	"""
	The roll-up level that was requested.
	"""
	category: Category!
	"""
	Positive magnitude.
	"""
	amount: Decimal!
	transactionCount: Int!
	"""
	Of the row's `kind` total, `0..1`.
	"""
	share: Float!
}

input CategoryInput {
	slug: String!
	name: String!
	kind: CategoryKind!
	parentSlug: String
}

enum CategoryKind {
	INCOME
	EXPENSE
	TRANSFER
	SAVING
}

scalar Date

scalar DateTime

scalar Decimal

enum Direction {
	INCOME
	SPENDING
}

enum FlagSource {
	AUTO
	USER
}

enum Granularity {
	DAY
	WEEK
	MONTH
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

enum LabelSource {
	USER
	RULE
	LLM_CACHE
	LLM
}

enum LabelStatus {
	RESOLVED
	NEEDS_REVIEW
}

input LoginInput {
	username: String!
	password: String!
}

type Me {
	id: UUID!
	username: String!
	displayName: String
}

type Mutation {
	"""
	`login`/`logout` are the only unauthenticated mutations (§4/§5). A
	bad username and a bad password return the same
	`extensions.code = "INVALID_CREDENTIALS"` with the same message — no
	user enumeration.
	"""
	login(input: LoginInput!): Me!
	logout: Boolean!
	setTransactionCategory(transactionId: UUID!, categorySlug: String!): Transaction!
	clearTransactionCategory(transactionId: UUID!): Transaction!
	splitTransaction(transactionId: UUID!, parts: [SplitPartInput!]!): Transaction!
	unsplitTransaction(transactionId: UUID!): Transaction!
	createCategory(input: CategoryInput!): Category!
	renameCategory(id: UUID!, name: String!): Category!
	archiveCategory(id: UUID!): Category!
	createRule(input: RuleInput!): Rule!
	updateRule(id: UUID!, input: RuleInput!): Rule!
	setRuleState(id: UUID!, state: RuleState!): Rule!
	reapplyRule(id: UUID!): Int!
	"""
	Replaces the whole tag set; `[]` clears (§4). **Stub**: frozen by
	WP0, real body is WP-B's.
	"""
	setTransactionTags(transactionId: UUID!, tags: [String!]!): Transaction!
	"""
	`null` clears the override and lets auto-detection decide again
	(§4). **Stub**: frozen by WP0, real body is WP-B's.
	"""
	setTransactionRecurring(transactionId: UUID!, recurring: Boolean): Transaction!
}

input PageInput {
	"""
	Clamped to `1..=200`.
	"""
	limit: Int! = 50
	offset: Int! = 0
}

type Query {
	"""
	Unauthenticated field (§4/§5): returns the caller's own identity, or
	`null` when there is no valid session. `AuthenticatedUser` (§4) does
	not carry `display_name` — it's loaded here with one extra query,
	the only place in the schema that needs it.
	"""
	me: Me
	accounts: [Account!]!
	transactions(filter: TransactionFilter, page: PageInput): TransactionPage!
	cashflowSummary(filter: TransactionFilter!, granularity: Granularity!): CashflowSummary!
	cashflowGraph(filter: TransactionFilter!, grouping: CashflowGraphInput): CashflowGraph!
	"""
	`categories` (§5): the shared tree is not tenant-scoped (§3's
	`owner_user_id` is reserved, always `NULL` this iteration) — any
	authenticated user sees the same catalog.
	"""
	categories(includeArchived: Boolean! = false): [Category!]!
	categoryBreakdown(filter: TransactionFilter!, level: Int! = 1, kind: CategoryKind): CategoryBreakdown!
	"""
	`rules` (§5): like `categories`, not tenant-scoped — rules apply to
	every account the labeler sees.
	"""
	rules(state: RuleState): [Rule!]!
	recentlyAutoApprovedRules(limit: Int! = 20): [Rule!]!
	reviewQueue(page: PageInput): ReviewQueue!
	"""
	`tags` (§4): all tags, descending count. **Stub**: frozen by WP0,
	real body is WP-B's.
	"""
	tags: [TagCount!]!
	"""
	`recurringSeries` (§4). **Stub**: frozen by WP0, real body is WP-B's.
	"""
	recurringSeries(filter: TransactionFilter): RecurringOverview!
}

enum RecurringCadence {
	MONTHLY
	QUARTERLY
	YEARLY
}

"""
`source = User` when overridden (§2.2); `seriesId` is `null` when
overridden in or out of a series.
"""
type RecurringInfo {
	isRecurring: Boolean!
	source: FlagSource!
	seriesId: UUID
	cadence: RecurringCadence
	medianAmount: Decimal
}

type RecurringOverview {
	series: [RecurringSeries!]!
	"""
	Expense series only, positive magnitude.
	"""
	totalMonthlyEquivalent: Decimal!
	currency: String!
}

type RecurringSeries {
	id: UUID!
	counterpartyKey: String!
	counterpartyName: String
	direction: Direction!
	cadence: RecurringCadence!
	"""
	Signed.
	"""
	medianAmount: Decimal!
	"""
	Signed, 4 dp (§3.2).
	"""
	monthlyEquivalent: Decimal!
	occurrenceCount: Int!
	firstDate: Date!
	lastDate: Date!
	nextExpectedDate: Date!
	"""
	`lastDate` older than cadence + grace.
	"""
	stale: Boolean!
}

type ReviewQueue {
	"""
	`status = NEEDS_REVIEW`.
	"""
	transactions: [Transaction!]!
	"""
	`state = IN_REVIEW`.
	"""
	pendingRules: [Rule!]!
	totalCount: Int!
}

enum ReviewReason {
	AMBIGUOUS
	NEW_CATEGORY
}

type Rule {
	id: UUID!
	name: String!
	category: Category!
	conditions: JSON!
	priority: Int!
	state: RuleState!
	origin: RuleOrigin!
	autoApproved: Boolean!
	confidence: Float
	evidenceCount: Int!
	createdAt: DateTime!
}

input RuleInput {
	name: String!
	categorySlug: String!
	conditions: JSON!
	priority: Int! = 0
}

enum RuleOrigin {
	USER
	LEARNED
}

enum RuleState {
	ACTIVE
	IN_REVIEW
	REVOKED
	REJECTED
}

input SplitPartInput {
	amount: Decimal!
	categorySlug: String!
}

type TagCount {
	tag: String!
	transactionCount: Int!
}

type Transaction {
	id: UUID!
	accountId: UUID!
	source: String!
	externalId: String!
	bookingDate: Date!
	valutaDate: Date
	bookingStatus: String!
	amount: Decimal!
	currency: String!
	counterpartyName: String
	counterpartyIban: String
	description: String
	transactionType: String
	label: TransactionLabel
	splits: [TransactionSplit!]!
	"""
	Iteration 3 §4: sorted, `[]` when untagged. **Stub**: frozen by WP0,
	real body is WP-B's.
	"""
	tags: [String!]!
	"""
	`null` = not an internal transfer (§4). **Stub**: frozen by WP0, real
	body is WP-B's.
	"""
	transfer: TransferInfo
	"""
	Always present; `isRecurring` may be `false` (§4). **Stub**: frozen by
	WP0, real body is WP-B's.
	"""
	recurring: RecurringInfo!
}

input TransactionFilter {
	"""
	Inclusive; `None` = unbounded.
	"""
	startDate: Date
	"""
	Inclusive; `None` = unbounded.
	"""
	endDate: Date
	"""
	`None`/empty = all of the caller's accounts.
	"""
	accountIds: [UUID!]
	"""
	Case-insensitive substring over `counterpartyName` + `description`.
	"""
	search: String
	"""
	`None` = both.
	"""
	direction: Direction
	"""
	Sankey drill-down: OR-ed exact matches.
	"""
	counterpartyNames: [String!]
	"""
	`false` selects the "Unknown" node's rows.
	"""
	hasCounterparty: Boolean
	"""
	Iteration 2 (§5): OR-ed; includes descendants of each slug.
	"""
	categorySlugs: [String!]
	"""
	`true` ⇒ no label at all (distinct from `needsReview`).
	"""
	uncategorized: Boolean
	needsReview: Boolean
	labelSources: [LabelSource!]
	"""
	Iteration 3 §4: AND-ed — the transaction carries all of them.
	"""
	tags: [String!]
	"""
	Matches the *effective* flag (§2.2, §4): auto unless overridden.
	"""
	recurring: Boolean
	"""
	`true` = only transfers, `false` = only non-transfers (§4).
	"""
	transfer: Boolean
}

type TransactionLabel {
	"""
	`null` while `status = NEEDS_REVIEW`.
	"""
	category: Category
	source: LabelSource!
	rule: Rule
	confidence: Float
	status: LabelStatus!
	reviewReason: ReviewReason
	proposedCategoryPath: String
	reasoning: String
}

type TransactionPage {
	items: [Transaction!]!
	totalCount: Int!
	limit: Int!
	offset: Int!
}

type TransactionSplit {
	index: Int!
	amount: Decimal!
	category: Category!
}

"""
`counterpartTransactionId` is `null` while the other leg is not
projected yet (§4).
"""
type TransferInfo {
	counterpartTransactionId: UUID
	counterpartAccountId: UUID
	match: TransferMatch!
}

enum TransferMatch {
	IBAN
	AMOUNT_DATE
}

scalar UUID

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
