type Account {
	id: UUID!
	"""
	`"comdirect"`.
	"""
	source: String!
	externalId: String!
	displayId: String
	accountType: String
	iban: String
	bic: String
	institute: String
	"""
	Login label, display only.
	"""
	label: String
	currency: String!
	latestBalance: Balance
}

"""
A count of transactions and what they are worth.
"""
type AttentionBucket {
	count: Int!
	"""
	Magnitude of the **signed** net of the transactions: a refund cancels the
	charge it reverses (as in the category breakdown). Accounts share a currency.
	"""
	totalAmount: Decimal!
}

type AttentionSummary {
	"""
	No category assigned (see the `uncategorized` transaction filter).
	"""
	uncategorized: AttentionBucket!
	"""
	Labels held for human review (see the `needsReview` filter).
	"""
	needsReview: AttentionBucket!
}

type Balance {
	date: Date!
	amount: Decimal!
	currency: String!
}

"""
Outcome of a bulk edit. Always `matched >= applied + failed`; the
remainder were already in the requested state.
"""
type BulkEditResult {
	"""
	How many transactions the filter matched.
	"""
	matched: Int!
	"""
	How many were actually changed.
	"""
	applied: Int!
	"""
	How many failed; the operation is not atomic.
	"""
	failed: Int!
	"""
	How many had splits that this category change discarded.
	"""
	splitsCleared: Int!
}

type CashflowBucket {
	"""
	Inclusive.
	"""
	start: Date!
	"""
	Inclusive.
	"""
	end: Date!
	"""
	Sum of `amount > 0`, positive.
	"""
	income: Decimal!
	"""
	Sum of `|amount|` for `amount < 0`, positive.
	"""
	spending: Decimal!
	"""
	`income - spending`.
	"""
	net: Decimal!
	transactionCount: Int!
}

"""
`CATEGORY` (iteration 2) and `TAG` (iteration 3) are reserved: declared,
rejected until implemented, so an old server never silently returns a
graph it did not build (§5).
"""
enum CashflowDimension {
	INCOME_SOURCE
	ACCOUNT
	OUTCOME
	CATEGORY
	TAG
}

type CashflowGraph {
	nodes: [CashflowNode!]!
	links: [CashflowLink!]!
	currency: String!
	"""
	Echoes what the server applied.
	"""
	dimensions: [CashflowDimension!]!
	truncated: Boolean!
}

input CashflowGraphInput {
	"""
	Left-to-right dimensions. Iteration 1 accepts only the default and
	errors otherwise.
	"""
	dimensions: [CashflowDimension!]! = [INCOME_SOURCE, ACCOUNT, OUTCOME]
	"""
	Remainder folded into one `Other` node.
	"""
	maxNodesPerDimension: Int! = 8
}

type CashflowLink {
	sourceId: ID!
	targetId: ID!
	"""
	Always positive.
	"""
	value: Decimal!
}

type CashflowNode {
	"""
	Opaque, stable within one response.
	"""
	id: ID!
	label: String!
	kind: CashflowNodeKind!
	"""
	Column index; the server lays out, not the client.
	"""
	depth: Int!
	"""
	`max(inflow, outflow)`.
	"""
	value: Decimal!
	"""
	e.g. `"account"` | `"category"` — null for synthetic nodes.
	"""
	refType: String
	"""
	Id within `refType`, for drill-down.
	"""
	refId: String
}

enum CashflowNodeKind {
	INCOME_SOURCE
	ACCOUNT
	SPENDING
	NET
	DEFICIT
	OTHER
	CATEGORY
	TAG
}

type CashflowSummary {
	buckets: [CashflowBucket!]!
	total: CashflowTotals!
	currency: String!
}

type CashflowTotals {
	income: Decimal!
	spending: Decimal!
	net: Decimal!
	transactionCount: Int!
}

type Category {
	id: UUID!
	slug: String!
	name: String!
	kind: CategoryKind!
	parentId: UUID
	depth: Int!
	archived: Boolean!
	"""
	`"seed"` | `"user"` (§3).
	"""
	origin: String!
}

type CategoryBreakdown {
	rows: [CategoryBreakdownRow!]!
	"""
	Label missing entirely.
	"""
	uncategorized: CategoryBreakdownRow
	"""
	Held; counted separately, never as spend.
	"""
	needsReview: CategoryBreakdownRow
	currency: String!
}

type CategoryBreakdownRow {
	"""
	The roll-up level that was requested.
	"""
	category: Category!
	"""
	Positive magnitude.
	"""
	amount: Decimal!
	transactionCount: Int!
	"""
	Of the row's `kind` total, `0..1`.
	"""
	share: Float!
}

input CategoryInput {
	slug: String!
	name: String!
	kind: CategoryKind!
	parentSlug: String
}

enum CategoryKind {
	INCOME
	EXPENSE
	TRANSFER
	SAVING
}

scalar Date

scalar DateTime

scalar Decimal

enum Direction {
	INCOME
	SPENDING
}

enum FlagSource {
	AUTO
	USER
}

type Goal {
	id: UUID!
	name: String!
	type: GoalType!
	amount: Decimal!
	currency: String!
	scope: GoalScope!
	periodKind: GoalPeriodKind!
	"""
	`null` for `FIXED`.
	"""
	cadence: GoalCadence
	"""
	`null` for `RECURRING`.
	"""
	startDate: Date
	"""
	`null` for `RECURRING` or an open-ended `FIXED`.
	"""
	endDate: Date
	archived: Boolean!
}

type GoalBucket {
	start: Date!
	end: Date!
	label: String!
	"""
	Positive magnitude.
	"""
	total: Decimal!
	"""
	Held-for-review, excluded from `total`.
	"""
	pending: Decimal!
	"""
	`amount - total`; negative when over.
	"""
	remaining: Decimal!
	"""
	`<= amount` for a limit, `>= amount` for a target.
	"""
	met: Boolean!
	inProgress: Boolean!
}

enum GoalCadence {
	MONTHLY
	QUARTERLY
	YEARLY
}

"""
Mirrors the `finreport.goal` event's scope and period (§2.1). Validated
at mutation time (§4): amount > 0; a non-empty scope; `RECURRING` requires
`cadence` and rejects `startDate`/`endDate`; `FIXED` requires `startDate`
and rejects `cadence`; `endDate >= startDate`; every category slug exists;
tags normalized with iteration 3's rules.
"""
input GoalInput {
	name: String!
	type: GoalType!
	amount: Decimal!
	currency: String! = "EUR"
	categorySlugs: [String!]! = []
	tags: [String!]! = []
	"""
	How the category and tag conditions join; ignored when the scope has
	only one of them.
	"""
	combine: ScopeCombine! = ALL
	"""
	How the listed tags join each other.
	"""
	tagCombine: ScopeCombine! = ALL
	periodKind: GoalPeriodKind!
	cadence: GoalCadence
	startDate: Date
	endDate: Date
}

enum GoalPeriodKind {
	RECURRING
	FIXED
}

type GoalProgress {
	goal: Goal!
	buckets: [GoalBucket!]!
	"""
	Across every bucket.
	"""
	total: Decimal!
	pending: Decimal!
	"""
	Over completed buckets only.
	"""
	averagePerPeriod: Decimal!
	currency: String!
}

type GoalScope {
	"""
	Resolved from slugs; archived ones are still listed.
	"""
	categories: [Category!]!
	tags: [String!]!
	combine: ScopeCombine!
	tagCombine: ScopeCombine!
}

enum GoalType {
	SPENDING_LIMIT
	SAVING_TARGET
}

enum Granularity {
	DAY
	WEEK
	MONTH
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

enum LabelSource {
	USER
	RULE
	LLM_CACHE
	LLM
}

enum LabelStatus {
	RESOLVED
	NEEDS_REVIEW
}

input LoginInput {
	username: String!
	password: String!
}

type Me {
	id: UUID!
	username: String!
	displayName: String
	isAdmin: Boolean!
}

type Mutation {
	"""
	`login`/`logout` are the only unauthenticated mutations (§4/§5). A
	bad username and a bad password return the same
	`extensions.code = "INVALID_CREDENTIALS"` with the same message — no
	user enumeration.
	"""
	login(input: LoginInput!): Me!
	logout: Boolean!
	setTransactionCategory(transactionId: UUID!, categorySlug: String!): Transaction!
	clearTransactionCategory(transactionId: UUID!): Transaction!
	splitTransaction(transactionId: UUID!, parts: [SplitPartInput!]!): Transaction!
	unsplitTransaction(transactionId: UUID!): Transaction!
	createCategory(input: CategoryInput!): Category!
	"""
	Idempotent `createCategory` for the review flow ("assign and create
	new category"): an equivalent existing category (same kind and parent)
	is returned as is; a clashing definition fails with `CONFLICT`.
	"""
	ensureCategory(input: CategoryInput!): Category!
	renameCategory(id: UUID!, name: String!): Category!
	archiveCategory(id: UUID!): Category!
	createRule(input: RuleInput!): Rule!
	updateRule(id: UUID!, input: RuleInput!): Rule!
	setRuleState(id: UUID!, state: RuleState!): Rule!
	reapplyRule(id: UUID!): Int!
	"""
	`createGoal` (iteration 4 §4).
	"""
	createGoal(input: GoalInput!): Goal!
	"""
	`updateGoal` (iteration 4 §4): read-modify-write on `finreport.goal`.
	"""
	updateGoal(id: UUID!, input: GoalInput!): Goal!
	archiveGoal(id: UUID!): Goal!
	"""
	Replaces the whole tag set; `[]` clears (§4).
	"""
	setTransactionTags(transactionId: UUID!, tags: [String!]!): Transaction!
	"""
	Overrides the category of every transaction the filter matches (and
	clears their splits). Restricted to the caller's own accounts; not
	atomic — see `BulkEditResult`.
	"""
	setTransactionsCategory(filter: TransactionFilter!, categorySlug: String!): BulkEditResult!
	"""
	Replaces the tag set of every transaction the filter matches; `[]`
	clears. Restricted to the caller's own accounts; not atomic.
	"""
	setTransactionsTags(filter: TransactionFilter!, tags: [String!]!): BulkEditResult!
	"""
	`null` clears the override and lets auto-detection decide again
	(§4).
	"""
	setTransactionRecurring(transactionId: UUID!, recurring: Boolean): Transaction!
}

input PageInput {
	"""
	Clamped to `1..=200`.
	"""
	limit: Int! = 50
	offset: Int! = 0
}

type Query {
	"""
	Unauthenticated field (§4/§5): returns the caller's own identity, or
	`null` when there is no valid session. `AuthenticatedUser` (§4) does
	not carry `display_name` — it's loaded here with one extra query,
	the only place in the schema that needs it.
	"""
	me: Me
	accounts: [Account!]!
	transactions(filter: TransactionFilter, page: PageInput, sort: TransactionSort): TransactionPage!
	cashflowSummary(filter: TransactionFilter!, granularity: Granularity!): CashflowSummary!
	cashflowGraph(filter: TransactionFilter!, grouping: CashflowGraphInput): CashflowGraph!
	"""
	`categories` (§5): the shared tree is not tenant-scoped (§3's
	`owner_user_id` is reserved, always `NULL` this iteration) — any
	authenticated user sees the same catalog.
	"""
	categories(includeArchived: Boolean! = false): [Category!]!
	categoryBreakdown(filter: TransactionFilter!, level: Int! = 1, kind: CategoryKind): CategoryBreakdown!
	"""
	`rules` (§5): like `categories`, not tenant-scoped — rules apply to
	every account the labeler sees.
	"""
	rules(state: RuleState): [Rule!]!
	recentlyAutoApprovedRules(limit: Int! = 20): [Rule!]!
	reviewQueue(page: PageInput): ReviewQueue!
	"""
	What is waiting for the user: uncategorised and held-for-review
	transactions with their worth. All-time, across the caller's accounts.
	"""
	attentionSummary: AttentionSummary!
	"""
	`tags` (§4): all tags, descending count.
	"""
	tags: [TagCount!]!
	"""
	`goals` (iteration 4 §4): the caller's own goals.
	"""
	goals(includeArchived: Boolean! = false): [Goal!]!
	goal(id: UUID!): Goal
	"""
	Window defaults to the goal's own period for FIXED, last 12 periods for RECURRING.
	"""
	goalProgress(id: UUID!, startDate: Date, endDate: Date): GoalProgress!
	"""
	The contribution rows behind a bucket, for drill-down.
	"""
	goalTransactions(id: UUID!, startDate: Date!, endDate: Date!, page: PageInput, sort: TransactionSort): TransactionPage!
	"""
	`recurringSeries` (§4).
	"""
	recurringSeries(filter: TransactionFilter): RecurringOverview!
}

enum RecurringCadence {
	MONTHLY
	QUARTERLY
	YEARLY
}

"""
`source = User` when overridden (§2.2); `seriesId` is `null` when
overridden in or out of a series.
"""
type RecurringInfo {
	isRecurring: Boolean!
	source: FlagSource!
	seriesId: UUID
	cadence: RecurringCadence
	medianAmount: Decimal
}

type RecurringOverview {
	series: [RecurringSeries!]!
	"""
	Expense series only, positive magnitude.
	"""
	totalMonthlyEquivalent: Decimal!
	currency: String!
}

type RecurringSeries {
	id: UUID!
	counterpartyKey: String!
	counterpartyName: String
	direction: Direction!
	cadence: RecurringCadence!
	"""
	Signed.
	"""
	medianAmount: Decimal!
	"""
	Signed, 4 dp (§3.2).
	"""
	monthlyEquivalent: Decimal!
	occurrenceCount: Int!
	firstDate: Date!
	lastDate: Date!
	nextExpectedDate: Date!
	"""
	`lastDate` older than cadence + grace.
	"""
	stale: Boolean!
}

type ReviewQueue {
	"""
	`status = NEEDS_REVIEW`.
	"""
	transactions: [Transaction!]!
	"""
	`state = IN_REVIEW`.
	"""
	pendingRules: [Rule!]!
	totalCount: Int!
}

enum ReviewReason {
	AMBIGUOUS
	NEW_CATEGORY
}

type Rule {
	id: UUID!
	name: String!
	category: Category!
	conditions: JSON!
	priority: Int!
	state: RuleState!
	origin: RuleOrigin!
	autoApproved: Boolean!
	confidence: Float
	evidenceCount: Int!
	createdAt: DateTime!
	"""
	How many of the caller's own transactions this rule's `conditions`
	match: the rule's reach, counted over every transaction in the
	caller's accounts regardless of how it is currently labelled and
	regardless of this rule's `state`. It is NOT the number of
	transactions this rule is currently the label source for (a more
	specific or higher-priority rule, a user override or a split can
	win a transaction this rule also matches). A rule with no
	conditions matches every transaction. Evaluated by the labeler's own
	condition matcher.
	"""
	matchingTransactionCount: Int!
}

input RuleInput {
	name: String!
	categorySlug: String!
	conditions: JSON!
	priority: Int! = 0
}

enum RuleOrigin {
	USER
	LEARNED
}

enum RuleState {
	ACTIVE
	IN_REVIEW
	REVOKED
	REJECTED
}

enum ScopeCombine {
	ALL
	ANY
}

enum SortDirection {
	ASC
	DESC
}

input SplitPartInput {
	amount: Decimal!
	categorySlug: String!
}

type TagCount {
	tag: String!
	transactionCount: Int!
}

type Transaction {
	id: UUID!
	accountId: UUID!
	source: String!
	externalId: String!
	bookingDate: Date!
	valutaDate: Date
	bookingStatus: String!
	amount: Decimal!
	currency: String!
	counterpartyName: String
	counterpartyIban: String
	description: String
	transactionType: String
	"""
	Normalised counterparty (`transaction.counterparty_key`), the same key
	rule learning and recurring detection use; filter by it with
	`TransactionFilter.counterpartyKeys`. `null` until the labeler has
	normalised the row.
	"""
	counterpartyKey: String
	label: TransactionLabel
	splits: [TransactionSplit!]!
	"""
	Iteration 3 §4: sorted, `[]` when untagged.
	"""
	tags: [String!]!
	"""
	`null` = not an internal transfer (§4).
	"""
	transfer: TransferInfo
	"""
	Always present; `isRecurring` may be `false` (§4).
	"""
	recurring: RecurringInfo!
}

input TransactionFilter {
	"""
	Inclusive; `None` = unbounded.
	"""
	startDate: Date
	"""
	Inclusive; `None` = unbounded.
	"""
	endDate: Date
	"""
	`None`/empty = all of the caller's accounts.
	"""
	accountIds: [UUID!]
	"""
	Case-insensitive substring over `counterpartyName` + `description`.
	"""
	search: String
	"""
	`None` = both.
	"""
	direction: Direction
	"""
	Sankey drill-down: OR-ed exact matches.
	"""
	counterpartyNames: [String!]
	"""
	`false` selects the "Unknown" node's rows.
	"""
	hasCounterparty: Boolean
	"""
	Iteration 2 (§5): OR-ed; includes descendants of each slug.
	"""
	categorySlugs: [String!]
	"""
	`true` ⇒ no label at all (distinct from `needsReview`).
	"""
	uncategorized: Boolean
	needsReview: Boolean
	labelSources: [LabelSource!]
	"""
	Iteration 3 §4: AND-ed — the transaction carries all of them.
	"""
	tags: [String!]
	"""
	Matches the *effective* flag (§2.2, §4): auto unless overridden.
	"""
	recurring: Boolean
	"""
	`true` = only transfers, `false` = only non-transfers (§4).
	"""
	transfer: Boolean
	"""
	Exact transaction ids, OR-ed among themselves and AND-ed with the
	other conditions.
	"""
	transactionIds: [UUID!]
	"""
	Inclusive bound on the amount's magnitude (absolute value); `None` =
	unbounded. Use `direction` to pick income or spending.
	"""
	amountMin: Decimal
	"""
	Inclusive bound on the amount's magnitude (absolute value); `None` =
	unbounded. Use `direction` to pick income or spending.
	"""
	amountMax: Decimal
	"""
	Normalized counterparty keys (`transaction.counterparty_key`), OR-ed.
	Matches variants of one merchant that `counterpartyNames` would miss.
	Omitted or empty = unconstrained.
	"""
	counterpartyKeys: [String!]
}

type TransactionLabel {
	"""
	`null` while `status = NEEDS_REVIEW`.
	"""
	category: Category
	source: LabelSource!
	rule: Rule
	confidence: Float
	status: LabelStatus!
	reviewReason: ReviewReason
	proposedCategoryPath: String
	reasoning: String
}

type TransactionPage {
	items: [Transaction!]!
	totalCount: Int!
	limit: Int!
	offset: Int!
}

"""
Ordering for a transaction list. Always completed with a deterministic
tiebreaker on the transaction id, so paging through equal keys never
repeats or drops a row. Omitting it keeps the default: newest booking
date first.
"""
input TransactionSort {
	field: TransactionSortField!
	direction: SortDirection! = DESC
}

"""
The column a transaction list is ordered by.
"""
enum TransactionSortField {
	"""
	Booking date, then external id.
	"""
	BOOKING_DATE
	"""
	The **signed** amount: DESC runs largest income to largest expense.
	(Filters `amountMin`/`amountMax` bound the magnitude; sorting keeps
	the sign so income and expense do not interleave.)
	"""
	AMOUNT
	"""
	Case-insensitive counterparty name. Transactions without one sort
	last in both directions.
	"""
	COUNTERPARTY_NAME
	"""
	Case-insensitive name of the resolved category (a user override
	outranks the label). Uncategorised and split transactions (which
	have no single category) sort last in both directions.
	"""
	CATEGORY
}

type TransactionSplit {
	index: Int!
	amount: Decimal!
	category: Category!
}

"""
`counterpartTransactionId` is `null` while the other leg is not
projected yet (§4).
"""
type TransferInfo {
	counterpartTransactionId: UUID
	counterpartAccountId: UUID
	match: TransferMatch!
}

enum TransferMatch {
	IBAN
	AMOUNT_DATE
}

scalar UUID

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
