version: '3.8'

name: finreport-be

services:
  finreport-be-postgres:
    image: postgres:17-alpine
    container_name: finreport-be-postgres
    restart: always
    environment:
      POSTGRES_DB: finreport
      POSTGRES_USER: finreport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/user/appdata/finreport-be/pgdata:/var/lib/postgresql/data
    networks:
      services-lan:
        ipv4_address: 192.168.100.46
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreport"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "net.unraid.docker.managed=composeman"

  # One-shot schema migration. Every service that touches the DB waits for
  # it to exit 0, so a deploy can never start code against an old schema
  # (APP_run_migrations=false keeps the long-running services from racing it).
  finreport-be-migrate:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be-migrate
    entrypoint: ["finreport-be-migrate"]
    command: ["up", "-s", "public"]
    restart: "no"
    depends_on:
      finreport-be-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finreport:${POSTGRES_PASSWORD}@192.168.100.46:5432/finreport
    networks:
      services-lan:
        ipv4_address: 192.168.100.51
    labels:
      - "net.unraid.docker.managed=composeman"

  finreport-be:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be
    restart: always
    depends_on:
      finreport-be-migrate:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info
      APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD}@192.168.100.46:5432/finreport
      APP_oauth_url: https://api.comdirect.de
      APP_url: https://api.comdirect.de/api
      APP_save_file_path: /app/data/.session.json
      # Admin bootstrap (webapp::auth::bootstrap): creates/rotates the
      # `admin` user and links every account to it on every startup.
      # Sourced from 1Password via terraform (random_password.admin +
      # onepassword_item.finreport_admin) — never set locally, so `just
      # dev-be`/`dev-demo` never bootstrap an admin user.
      APP_admin_password: ${APP_admin_password:-}
      # CORS allow-list for the SvelteKit frontend's same-origin proxy
      # (`finreport-fe/src/lib/server/graphqlBackend.ts` forwards the
      # browser's own `Origin` header verbatim) — an empty list rejects every
      # request. `finreport-fe` below is served at this exact origin through
      # the same `<service>.lab.anydef.de` OPNsense/HAProxy convention used
      # for `finreport-be.lab.anydef.de` (terraform/main.tf).
      APP_allowed_origins: https://finreport.lab.anydef.de
      # The same HAProxy frontend (`1_HTTPS_frontend`, terraform/main.tf)
      # terminates TLS for every `*.lab.anydef.de` host, so the frontend will
      # be HTTPS too once deployed: Secure cookies are safe to require.
      APP_cookie_secure: "true"
      # Startup no longer runs migrations implicitly (see
      # finreport-be-projector below and the runbook's explicit migrate
      # step) — CI's image swap must not auto-migrate a live database.
      APP_run_migrations: "false"
    ports:
      - "9040:8080"
    networks:
      finreport-be-net:
      services-lan:
        ipv4_address: 192.168.100.45
    volumes:
      - /mnt/user/appdata/finreport-be:/app/data
    labels:
      - "net.unraid.docker.webui=http://192.168.100.45:8080"
      - "net.unraid.docker.managed=composeman"
      - "net.unraid.docker.shell=bash"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/docker-library/docs/refs/heads/master/mediawiki/logo.svg"

  # SvelteKit (adapter-node) frontend, served at finreport.lab.anydef.de
  # through the same HAProxy/unbound convention as finreport-be (see
  # terraform/main.tf). Its own GraphQL proxy route forwards to finreport-be
  # over services-lan, so it never needs to leave the macvlan network.
  finreport-fe:
    image: ${DOCKER_REGISTRY}/finreport-fe:latest
    pull_policy: always
    container_name: finreport-fe
    restart: always
    depends_on:
      - finreport-be
    environment:
      NODE_ENV: production
      PORT: "3000"
      # `graphqlBackend.ts` reads this via `$env/dynamic/private` (runtime,
      # not baked into the build), so it can point at finreport-be's
      # services-lan address without a rebuild.
      GRAPHQL_URL: http://192.168.100.45:8080/graphql
      # SvelteKit's CSRF check and the proxy's cookie handling both need the
      # real external origin, not the container's own http://localhost:3000.
      ORIGIN: https://finreport.lab.anydef.de
      # Mock mode is a dev-only escape hatch (`src/lib/server/graphqlBackend.ts`)
      # — explicitly unset here so a stray default can never ship fake data.
      PUBLIC_USE_MOCKS: "0"
    networks:
      services-lan:
        ipv4_address: 192.168.100.50
    labels:
      - "net.unraid.docker.webui=http://192.168.100.50:3000"
      - "net.unraid.docker.managed=composeman"

  finreport-be-importer:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be-importer
    entrypoint: ["finreport-be-importer"]
    restart: always
    environment:
      RUST_LOG: info
      # No APP_database_url (§2.6): the importer only publishes raw payloads
      # to Kafka now — it never writes Postgres (the projector does, from the
      # event log). Postgres access is therefore no longer needed here at all.
      APP_oauth_url: https://api.comdirect.de
      APP_url: https://api.comdirect.de/api
      APP_save_file_path: /app/data/.session.json
      # Event-log target: central homelab Kafka, not deployed by this repo.
      # Required (§2.6) — a missing broker is now a startup error, not
      # "publishing disabled": with no Postgres write path left, an importer
      # that can't publish can't do anything useful.
      APP_kafka_brokers: kafka.lab.anydef.de:9092
      # Comdirect logins, numbered. The importer runs one task per account in
      # this single container, so adding a login is just another block here
      # (plus its TF_VAR_app_account_<n>_* entries in .env.tpl) — no new
      # container, address or port.
      #
      # The label is not a secret and does not vary by environment, so it is
      # written here rather than plumbed through 1Password and terraform.
      APP_accounts__0__name: Comdirect Family
      APP_accounts__0__client_id: ${APP_accounts__0__client_id}
      APP_accounts__0__client_secret: ${APP_accounts__0__client_secret}
      APP_accounts__0__zugangsnummer: ${APP_accounts__0__zugangsnummer}
      APP_accounts__0__pin: ${APP_accounts__0__pin}
      # Pinned to the path this importer already uses, so the upgrade keeps its
      # session tokens instead of asking for a fresh TAN.
      APP_accounts__0__save_file_path: /app/data/.session.json
      # Second login. Its session lands beside the first as .session.1.json
      # (APP_save_file_path + the account key). Credentials come from the
      # TF_VAR_app_account_1_* entries in .env.tpl.
      APP_accounts__1__name: Comdirect Pavlo
      APP_accounts__1__client_id: ${APP_accounts__1__client_id}
      APP_accounts__1__client_secret: ${APP_accounts__1__client_secret}
      APP_accounts__1__zugangsnummer: ${APP_accounts__1__zugangsnummer}
      APP_accounts__1__pin: ${APP_accounts__1__pin}
    networks:
      services-lan:
        ipv4_address: 192.168.100.47
    volumes:
      - /mnt/user/appdata/finreport-be:/app/data
    labels:
      - "net.unraid.docker.managed=composeman"

  # Builds the Postgres read model from the event log (§2.3). Long-running
  # consumer, not an HTTP server, so it gets its own container rather than
  # sharing `finreport-be`'s image entrypoint.
  finreport-be-projector:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be-projector
    entrypoint: ["projector"]
    restart: always
    depends_on:
      finreport-be-migrate:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info
      APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD}@192.168.100.46:5432/finreport
      APP_kafka_brokers: kafka.lab.anydef.de:9092
      APP_oauth_url: https://api.comdirect.de
      APP_url: https://api.comdirect.de/api
      APP_save_file_path: /app/data/.session.json
      # `admin` is created by finreport-be's startup bootstrap
      # (webapp::auth::bootstrap) before this projector ever runs, so every
      # newly projected account links to it automatically (§4), no manual
      # `user-admin link --all` needed.
      APP_projector_default_owner: admin
      # Same reasoning as finreport-be above: migrations are an explicit
      # runbook step (`finreport-be-migrate`), not an implicit side effect of
      # a container restart.
      APP_run_migrations: "false"
    networks:
      services-lan:
        ipv4_address: 192.168.100.48
    volumes:
      - /mnt/user/appdata/finreport-be:/app/data
    labels:
      - "net.unraid.docker.managed=composeman"

  # Consumes finreport.transaction/.user-label/.rule/.label-request and
  # resolves labels (docs/specs/iteration-2.md §2.3). A second, independent
  # always-on consumer alongside the projector — it refuses to start while
  # the projector lags (APP_labeler_max_projection_lag), so the compose
  # ordering here doesn't need to express that dependency itself.
  finreport-be-labeler:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be-labeler
    entrypoint: ["labeler"]
    restart: always
    depends_on:
      finreport-be-migrate:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info
      APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD}@192.168.100.46:5432/finreport
      APP_kafka_brokers: kafka.lab.anydef.de:9092
      # Non-secret knobs (§4) — provider, model and the auto-approve
      # threshold are ordinary config, not secrets, so they live here rather
      # than in .env.tpl. `anthropic` is picked deliberately: this is the one
      # place the Anthropic key is actually used; everywhere else (including
      # `just dev-demo`) keeps the zero-cost `fake` default.
      APP_llm_provider: anthropic
      APP_llm_model: claude-sonnet-4-5
      # Secret — sourced from TF_VAR_anthropic_api_key in .env.tpl via
      # terraform/variables.tf's `anthropic_api_key` and
      # terraform/main.tf's `module "portainer_stack"` extra_env (same
      # mechanism as POSTGRES_PASSWORD there). Resolves empty if that secret
      # is unset, and the labeler then refuses to build an Anthropic
      # provider (lazy validation, §4) rather than failing to start.
      APP_anthropic_api_key: ${APP_anthropic_api_key:-}
      # Migrations are the explicit `finreport-be-migrate` runbook step.
      APP_run_migrations: "false"
    networks:
      services-lan:
        ipv4_address: 192.168.100.49
    volumes:
      - /mnt/user/appdata/finreport-be:/app/data
    labels:
      - "net.unraid.docker.managed=composeman"

networks:
  services-lan:
    external: true
  finreport-be-net:
    driver: bridge