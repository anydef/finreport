version: '3.8'

name: finreport-be

services:
  finreport-be-postgres:
    image: postgres:17-alpine
    container_name: finreport-be-postgres
    restart: always
    environment:
      POSTGRES_DB: finreport
      POSTGRES_USER: finreport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/user/appdata/finreport-be/pgdata:/var/lib/postgresql/data
    networks:
      services-lan:
        ipv4_address: 192.168.100.33
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreport"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "net.unraid.docker.managed=composeman"

  # Redpanda (Kafka API) broker for the event-log migration. Phase 1 is a
  # dual-write: the importer publishes here while Postgres stays the source of
  # truth, so this broker being down must never stop an import.
  #
  # It gets its own services-lan address and publishes NO host ports, so
  # nothing on the tower contends for 9092. Topics are managed by terraform
  # (terraform/kafka), not auto-created here.
  finreport-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    container_name: finreport-redpanda
    restart: always
    command:
      - redpanda
      - start
      - --node-id=0
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://192.168.100.37:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=192.168.100.37:33145
    networks:
      services-lan:
        ipv4_address: 192.168.100.37
    volumes:
      # This directory MUST be owned by the image's `redpanda` user. The image
      # runs as that user (not root) and never chowns, unlike the postgres
      # image, so a fresh root-owned bind mount makes redpanda die on its first
      # write with `Permission denied` and restart forever:
      #     uid=$(docker run --rm --entrypoint id \
      #             docker.redpanda.com/redpandadata/redpanda:v24.3.6 -u)
      #     chown -R "$uid:$uid" /mnt/user/appdata/finreport-redpanda
      - /mnt/user/appdata/finreport-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - "net.unraid.docker.managed=composeman"

  finreport-be:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be
    restart: always
    depends_on:
      finreport-be-postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD}@192.168.100.33:5432/finreport
      APP_oauth_url: https://api.comdirect.de
      APP_url: https://api.comdirect.de/api
      APP_save_file_path: /app/data/.session.json
    ports:
      - "9040:8080"
    networks:
      finreport-be-net:
      services-lan:
        ipv4_address: 192.168.100.32
    volumes:
      - /mnt/user/appdata/finreport-be:/app/data
    labels:
      - "net.unraid.docker.webui=http://192.168.100.32:8080"
      - "net.unraid.docker.managed=composeman"
      - "net.unraid.docker.shell=bash"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/docker-library/docs/refs/heads/master/mediawiki/logo.svg"

  finreport-be-importer:
    image: ${DOCKER_REGISTRY}/finreport-be:latest
    pull_policy: always
    container_name: finreport-be-importer
    entrypoint: ["finreport-be-importer"]
    restart: always
    depends_on:
      finreport-be-postgres:
        condition: service_healthy
      finreport-redpanda:
        condition: service_started
    environment:
      RUST_LOG: info
      APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD}@192.168.100.33:5432/finreport
      APP_oauth_url: https://api.comdirect.de
      APP_url: https://api.comdirect.de/api
      APP_save_file_path: /app/data/.session.json
      # Event-log dual-write target. Unset it to disable publishing entirely
      # (that is what local dev does) — imports carry on either way.
      APP_kafka_brokers: 192.168.100.37:9092
      # Comdirect logins, numbered. The importer runs one task per account in
      # this single container, so adding a login is just another block here
      # (plus its TF_VAR_app_account_<n>_* entries in .env.tpl) — no new
      # container, address or port.
      #
      # The label is not a secret and does not vary by environment, so it is
      # written here rather than plumbed through 1Password and terraform.
      APP_accounts__0__name: Comdirect Family
      APP_accounts__0__client_id: ${APP_accounts__0__client_id}
      APP_accounts__0__client_secret: ${APP_accounts__0__client_secret}
      APP_accounts__0__zugangsnummer: ${APP_accounts__0__zugangsnummer}
      APP_accounts__0__pin: ${APP_accounts__0__pin}
      # Pinned to the path this importer already uses, so the upgrade keeps its
      # session tokens instead of asking for a fresh TAN.
      APP_accounts__0__save_file_path: /app/data/.session.json
      # Second login. Its session lands beside the first as .session.1.json
      # (APP_save_file_path + the account key). Credentials come from the
      # TF_VAR_app_account_1_* entries in .env.tpl.
      APP_accounts__1__name: Comdirect Pavlo
      APP_accounts__1__client_id: ${APP_accounts__1__client_id}
      APP_accounts__1__client_secret: ${APP_accounts__1__client_secret}
      APP_accounts__1__zugangsnummer: ${APP_accounts__1__zugangsnummer}
      APP_accounts__1__pin: ${APP_accounts__1__pin}
    networks:
      services-lan:
        ipv4_address: 192.168.100.35
    volumes:
      - /mnt/user/appdata/finreport-be:/app/data
    labels:
      - "net.unraid.docker.managed=composeman"

networks:
  services-lan:
    external: true
  finreport-be-net:
    driver: bridge