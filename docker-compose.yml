# Shared by every importer process — one per Comdirect login.
x-importer: &importer
  build:
    context: .
  profiles: ["importer"]
  entrypoint: ["finreport-be-importer"]
  restart: always
  depends_on:
    finreport-be-postgres:
      condition: service_healthy
  volumes:
    - finreport-data:/app/data

x-importer-env: &importer-env
  RUST_LOG: info
  APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD:-finreport}@finreport-be-postgres:5432/finreport
  APP_oauth_url: https://api.comdirect.de
  APP_url: https://api.comdirect.de/api
  APP_save_file_path: /app/data/.session.json

services:
  finreport-be-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finreport
      POSTGRES_USER: finreport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finreport}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreport"]
      interval: 5s
      timeout: 5s
      retries: 5

  finreport-be:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      finreport-be-postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      APP_database_url: postgresql://finreport:${POSTGRES_PASSWORD:-finreport}@finreport-be-postgres:5432/finreport
      APP_oauth_url: https://api.comdirect.de
      APP_url: https://api.comdirect.de/api
      APP_save_file_path: /app/data/.session.json
    ports:
      - "8080:8080"
    volumes:
      - finreport-data:/app/data

  # One importer process per Comdirect login. They can't share a process: each
  # login approves its own push-TAN, and a session that goes stale has to be
  # re-bootstrapped without stalling the others. Each container also sees only
  # its own credentials.
  #
  # To add a login: copy a block below, bump the index in the service name, the
  # --account value and the APP_accounts__<n>__* keys, then add the matching
  # variables to terraform's extra_env (terraform/main.tf).
  finreport-be-importer-0:
    <<: *importer
    command: ["--account", "0"]
    environment:
      <<: *importer-env
      APP_accounts__0__name: ${APP_accounts__0__name:-}
      APP_accounts__0__client_id: ${APP_accounts__0__client_id:-}
      APP_accounts__0__client_secret: ${APP_accounts__0__client_secret:-}
      APP_accounts__0__zugangsnummer: ${APP_accounts__0__zugangsnummer:-}
      APP_accounts__0__pin: ${APP_accounts__0__pin:-}
      # Pinned to the unsuffixed path this importer already used when it was
      # the only one, so upgrading doesn't throw away its session tokens.
      APP_accounts__0__save_file_path: /app/data/.session.json

  finreport-be-importer-1:
    <<: *importer
    command: ["--account", "1"]
    environment:
      <<: *importer-env
      APP_accounts__1__name: ${APP_accounts__1__name:-}
      APP_accounts__1__client_id: ${APP_accounts__1__client_id:-}
      APP_accounts__1__client_secret: ${APP_accounts__1__client_secret:-}
      APP_accounts__1__zugangsnummer: ${APP_accounts__1__zugangsnummer:-}
      APP_accounts__1__pin: ${APP_accounts__1__pin:-}

volumes:
  pgdata:
  finreport-data:
