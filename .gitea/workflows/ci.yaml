name: CI

# Fast, offline PR feedback — unit tests + lint only (§9 WP6). The
# `build-deploy.yaml` workflow stays the only one that builds/pushes images
# and deploys; this one never touches Docker images, Terraform, or Portainer.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust unit tests + lint
    runs-on: rust-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to /usr/local/bin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Unit tests only — the testcontainers-backed `integration` feature
      # needs a Docker daemon and is intentionally left to `just
      # test-integration`, run locally/manually (§8), not on every PR.
      - name: Run unit tests
        run: just test

      - name: Run lint
        run: just lint

  frontend:
    name: Frontend lint + unit tests
    runs-on: rust-web
    defaults:
      run:
        working-directory: finreport-fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finreport-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Enforcing again as of 2026-10-27. This was `continue-on-error: true`
      # because the tree carried pre-existing prettier/eslint violations, which
      # meant `prettier --check` failed first and **eslint never ran at all** —
      # so the step reported known debt and hid anything new behind it. The
      # debt is cleared (11 files formatted, the generated `schema.graphql`
      # moved to `.prettierignore`, 5 eslint errors fixed), so the step can
      # block again and a new violation is now visible instead of buried.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
