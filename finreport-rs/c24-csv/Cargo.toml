[package]
name = "c24-csv"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1"
hex = "0.4"
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0.140"
