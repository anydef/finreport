type Account {
	id: Int!
	accountId: String!
	displayId: String!
	accountType: String!
	iban: String!
	bic: String!
	institute: String!
	"""
	Human-readable label of the Comdirect login this account was imported
	through. Null when that login has no label configured; use `accountId`
	to reference an account.
	"""
	accountName: String
}

type MutationRoot {
	loadAccounts: Boolean!
}

type QueryRoot {
	accounts: [Account!]!
	transactions(startDate: String, endDate: String, accountId: String): [Transaction!]!
	lastTransactionDate(accountId: String): String
}

type Transaction {
	reference: String!
	accountId: String!
	bookingStatus: String!
	bookingDate: String!
	amount: Float!
	remitter: String!
	deptor: String!
	creditor: String!
	creditorId: String!
	creditorMandateId: String!
	remittanceInfo: String!
	transactionType: String!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
