"""
`displayName` is resolved in `display_aliases.rs` (its `ComplexObject`).
"""
type Account {
	id: UUID!
	"""
	`"comdirect"`.
	"""
	source: String!
	externalId: String!
	displayId: String
	accountType: String
	iban: String
	bic: String
	institute: String
	"""
	Login label, display only.
	"""
	label: String
	currency: String!
	latestBalance: Balance
	"""
	The caller's alias for this account if they set one, else the login
	label, IBAN or display id. `label` itself stays the login label.
	"""
	displayName: String!
}

"""
A count of transactions and what they are worth.
"""
type AttentionBucket {
	count: Int!
	"""
	Magnitude of the **signed** net of the transactions: a refund cancels the
	charge it reverses (as in the category breakdown). Accounts share a currency.
	"""
	totalAmount: Decimal!
}

type AttentionSummary {
	"""
	No category assigned (see the `uncategorized` transaction filter).
	"""
	uncategorized: AttentionBucket!
	"""
	Labels held for human review (see the `needsReview` filter).
	"""
	needsReview: AttentionBucket!
}

type Balance {
	date: Date!
	amount: Decimal!
	currency: String!
}

"""
Outcome of a bulk edit. Always `matched >= applied + failed`; the
remainder were already in the requested state.
"""
type BulkEditResult {
	"""
	How many transactions the filter matched.
	"""
	matched: Int!
	"""
	How many were actually changed.
	"""
	applied: Int!
	"""
	How many failed; the operation is not atomic.
	"""
	failed: Int!
	"""
	How many had splits that this category change discarded.
	"""
	splitsCleared: Int!
}

type CashflowBucket {
	"""
	Inclusive.
	"""
	start: Date!
	"""
	Inclusive.
	"""
	end: Date!
	"""
	Sum of `amount > 0`, positive.
	"""
	income: Decimal!
	"""
	Sum of `|amount|` for `amount < 0`, positive.
	"""
	spending: Decimal!
	"""
	`income - spending`.
	"""
	net: Decimal!
	transactionCount: Int!
}

"""
`CATEGORY` (iteration 2) and `TAG` (iteration 3) are reserved: declared,
rejected until implemented, so an old server never silently returns a
graph it did not build (§5).
"""
enum CashflowDimension {
	INCOME_SOURCE
	ACCOUNT
	OUTCOME
	CATEGORY
	TAG
}

type CashflowGraph {
	nodes: [CashflowNode!]!
	links: [CashflowLink!]!
	currency: String!
	"""
	Echoes what the server applied.
	"""
	dimensions: [CashflowDimension!]!
	truncated: Boolean!
}

input CashflowGraphInput {
	"""
	Left-to-right dimensions. Iteration 1 accepts only the default and
	errors otherwise.
	"""
	dimensions: [CashflowDimension!]! = [INCOME_SOURCE, ACCOUNT, OUTCOME]
	"""
	Remainder folded into one `Other` node.
	"""
	maxNodesPerDimension: Int! = 8
}

type CashflowLink {
	sourceId: ID!
	targetId: ID!
	"""
	Always positive.
	"""
	value: Decimal!
}

type CashflowNode {
	"""
	Opaque, stable within one response.
	"""
	id: ID!
	label: String!
	kind: CashflowNodeKind!
	"""
	Column index; the server lays out, not the client.
	"""
	depth: Int!
	"""
	`max(inflow, outflow)`.
	"""
	value: Decimal!
	"""
	e.g. `"account"` | `"category"` — null for synthetic nodes.
	"""
	refType: String
	"""
	Id within `refType`, for drill-down.
	"""
	refId: String
}

enum CashflowNodeKind {
	INCOME_SOURCE
	ACCOUNT
	SPENDING
	NET
	DEFICIT
	OTHER
	CATEGORY
	TAG
}

type CashflowSummary {
	buckets: [CashflowBucket!]!
	total: CashflowTotals!
	currency: String!
}

type CashflowTotals {
	income: Decimal!
	spending: Decimal!
	net: Decimal!
	transactionCount: Int!
}

type Category {
	id: UUID!
	slug: String!
	name: String!
	kind: CategoryKind!
	parentId: UUID
	depth: Int!
	archived: Boolean!
	"""
	`"seed"` | `"user"` (§3).
	"""
	origin: String!
}

type CategoryBreakdown {
	rows: [CategoryBreakdownRow!]!
	"""
	Label missing entirely.
	"""
	uncategorized: CategoryBreakdownRow
	"""
	Held; counted separately, never as spend.
	"""
	needsReview: CategoryBreakdownRow
	currency: String!
}

type CategoryBreakdownRow {
	"""
	The roll-up level that was requested.
	"""
	category: Category!
	"""
	Positive magnitude.
	"""
	amount: Decimal!
	transactionCount: Int!
	"""
	Of the row's `kind` total, `0..1`.
	"""
	share: Float!
}

type CategoryComparison {
	periods: [ComparisonPeriod!]!
	"""
	Every category that appears in at least one period, heaviest first.
	"""
	categories: [ComparisonCategory!]!
	currency: String!
}

input CategoryInput {
	slug: String!
	name: String!
	kind: CategoryKind!
	parentSlug: String
}

enum CategoryKind {
	INCOME
	EXPENSE
	TRANSFER
	SAVING
}

type ComparisonCategory {
	category: Category!
	"""
	Sum of `cells`, so the list can be ordered by overall weight.
	"""
	total: Decimal!
	"""
	One per entry of `periods`, in the same order.
	"""
	cells: [ComparisonCell!]!
}

type ComparisonCell {
	"""
	Magnitude of the category's signed net in the period; `0` when the
	category had no transactions (or a refund cancelled them).
	"""
	amount: Decimal!
	"""
	`0` means the category was absent from the period altogether, as opposed
	to present and netting to zero.
	"""
	transactionCount: Int!
}

type ComparisonPeriod {
	"""
	Inclusive. The first and last periods are clipped to the requested range.
	"""
	start: Date!
	"""
	Inclusive.
	"""
	end: Date!
	"""
	Everything spent in the period that is not held for review: the
	categories' amounts plus `uncategorized`. This is the headline figure.
	"""
	total: Decimal!
	"""
	Unlabelled spending, as the breakdown's `uncategorized` row (magnitude of
	the signed net). Included in `total`.
	"""
	uncategorized: Decimal!
	"""
	Held for review, as the breakdown's `needsReview` row. Deliberately NOT
	in `total` and in no category: the label is not trusted yet.
	"""
	needsReview: Decimal!
}

scalar Date

scalar DateTime

scalar Decimal

enum Direction {
	INCOME
	SPENDING
}

"""
One nickname, with the original name it replaces.
"""
type DisplayAlias {
	kind: DisplayAliasKind!
	"""
	The normalised counterparty key, or the account id.
	"""
	key: String!
	alias: String!
	"""
	The name shown when there is no alias: the most frequent spelling on
	the caller's transactions (counterparty) or the account's label /
	IBAN. Falls back to the key.
	"""
	rawName: String!
	"""
	Caller's transactions carrying this counterparty key; `null` for an
	account alias.
	"""
	transactionCount: Int
	updatedAt: DateTime!
}

enum DisplayAliasKind {
	"""
	A merchant, or an own account that is not connected: keyed by the
	normalised counterparty key.
	"""
	COUNTERPARTY
	"""
	One of the caller's connected accounts: keyed by the account id.
	"""
	ACCOUNT
}

enum FlagSource {
	AUTO
	USER
}

type Goal {
	id: UUID!
	name: String!
	type: GoalType!
	amount: Decimal!
	currency: String!
	scope: GoalScope!
	periodKind: GoalPeriodKind!
	"""
	`null` for `FIXED`.
	"""
	cadence: GoalCadence
	"""
	`null` for `RECURRING`.
	"""
	startDate: Date
	"""
	`null` for `RECURRING` or an open-ended `FIXED`.
	"""
	endDate: Date
	archived: Boolean!
}

type GoalBucket {
	start: Date!
	end: Date!
	label: String!
	"""
	Positive magnitude.
	"""
	total: Decimal!
	"""
	Held-for-review, excluded from `total`.
	"""
	pending: Decimal!
	"""
	`amount - total`; negative when over.
	"""
	remaining: Decimal!
	"""
	`<= amount` for a limit, `>= amount` for a target.
	"""
	met: Boolean!
	inProgress: Boolean!
}

enum GoalCadence {
	MONTHLY
	QUARTERLY
	YEARLY
}

"""
Mirrors the `finreport.goal` event's scope and period (§2.1). Validated
at mutation time (§4): amount > 0; a non-empty scope; `RECURRING` requires
`cadence` and rejects `startDate`/`endDate`; `FIXED` requires `startDate`
and rejects `cadence`; `endDate >= startDate`; every category slug exists;
tags normalized with iteration 3's rules.
"""
input GoalInput {
	name: String!
	type: GoalType!
	amount: Decimal!
	currency: String! = "EUR"
	categorySlugs: [String!]! = []
	tags: [String!]! = []
	"""
	How the category and tag conditions join; ignored when the scope has
	only one of them.
	"""
	combine: ScopeCombine! = ALL
	"""
	How the listed tags join each other.
	"""
	tagCombine: ScopeCombine! = ALL
	periodKind: GoalPeriodKind!
	cadence: GoalCadence
	startDate: Date
	endDate: Date
}

enum GoalPeriodKind {
	RECURRING
	FIXED
}

type GoalProgress {
	goal: Goal!
	buckets: [GoalBucket!]!
	"""
	Across every bucket.
	"""
	total: Decimal!
	pending: Decimal!
	"""
	Over completed buckets only.
	"""
	averagePerPeriod: Decimal!
	currency: String!
}

type GoalScope {
	"""
	Resolved from slugs; archived ones are still listed.
	"""
	categories: [Category!]!
	tags: [String!]!
	combine: ScopeCombine!
	tagCombine: ScopeCombine!
}

enum GoalType {
	SPENDING_LIMIT
	SAVING_TARGET
}

enum Granularity {
	DAY
	WEEK
	MONTH
}

type HeldMerchantGroup {
	"""
	The normalised merchant key (`transaction.counterparty_key`), the value
	to pass in `TransactionFilter.counterpartyKeys`. `null` for the single
	bucket of held transactions that have no key; no filter can address
	that bucket, only individual transaction ids can.
	"""
	counterpartyKey: String
	"""
	The most common `counterpartyName` among the group's held
	transactions (ties broken alphabetically, so it is stable). Falls back
	to the key; the ungrouped bucket is named "No merchant key".
	"""
	displayName: String!
	"""
	How many held transactions the group has.
	"""
	heldCount: Int!
	"""
	Signed sum of the group's amounts (negative = net spending), in
	`currency`. A merchant paid in two currencies is summed as-is.
	"""
	totalAmount: Decimal!
	"""
	The most common currency of the group.
	"""
	currency: String!
	"""
	The distinct review reasons present in the group.
	"""
	reviewReasons: [ReviewReason!]!
	"""
	The LLM's most common proposed category path (`proposedCategoryPath`)
	among the group, or `null` if none of them carries one. Ties are broken
	alphabetically.
	"""
	proposedCategoryPath: String
	"""
	How many of the group's held transactions carry exactly
	`proposedCategoryPath`. The proposal is unanimous iff this equals
	`heldCount`; anything less means the group disagrees (or some members
	have no proposal) and a one-click accept would be a guess.
	"""
	proposedCategoryVotes: Int!
}

type HeldMerchantGroups {
	"""
	This page of groups, largest `heldCount` first (ties by name).
	"""
	groups: [HeldMerchantGroup!]!
	"""
	Number of groups in total, the ungrouped bucket included.
	"""
	groupCount: Int!
	"""
	Number of held transactions in total; equals the sum of every group's
	`heldCount` and `reviewQueue.totalCount`.
	"""
	heldCount: Int!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

enum LabelSource {
	USER
	RULE
	LLM_CACHE
	LLM
}

enum LabelStatus {
	RESOLVED
	NEEDS_REVIEW
}

"""
One merchant the learner has been told to leave alone.
"""
type LearningExemption {
	"""
	The normalised merchant key rules and the learner index on.
	"""
	counterpartyKey: String!
	"""
	The merchant's name as it appears on the caller's transactions (the
	most frequent spelling), falling back to the key when the caller has
	none.
	"""
	displayName: String!
	"""
	How many of the caller's transactions carry this merchant key.
	"""
	transactionCount: Int!
	exemptedAt: DateTime!
}

"""
A transaction that could be linked to another, with how well it fits.
"""
type LinkCandidate {
	transaction: Transaction!
	"""
	0..1: closer in amount and nearer in date scores higher.
	"""
	score: Float!
}

input LoginInput {
	username: String!
	password: String!
}

type Me {
	id: UUID!
	username: String!
	displayName: String
	isAdmin: Boolean!
}

type Mutation {
	"""
	`login`/`logout` are the only unauthenticated mutations (§4/§5). A
	bad username and a bad password return the same
	`extensions.code = "INVALID_CREDENTIALS"` with the same message — no
	user enumeration.
	"""
	login(input: LoginInput!): Me!
	logout: Boolean!
	setTransactionCategory(transactionId: UUID!, categorySlug: String!): Transaction!
	clearTransactionCategory(transactionId: UUID!): Transaction!
	splitTransaction(transactionId: UUID!, parts: [SplitPartInput!]!): Transaction!
	unsplitTransaction(transactionId: UUID!): Transaction!
	createCategory(input: CategoryInput!): Category!
	"""
	Idempotent `createCategory` for the review flow ("assign and create
	new category"): an equivalent existing category (same kind and parent)
	is returned as is; a clashing definition fails with `CONFLICT`.
	"""
	ensureCategory(input: CategoryInput!): Category!
	renameCategory(id: UUID!, name: String!): Category!
	archiveCategory(id: UUID!): Category!
	createRule(input: RuleInput!): Rule!
	updateRule(id: UUID!, input: RuleInput!): Rule!
	setRuleState(id: UUID!, state: RuleState!): Rule!
	reapplyRule(id: UUID!): Int!
	"""
	`exemptFromLearning`: never learn a rule for this merchant again, and
	discard its learned rules unless the user has touched them.
	"""
	exemptFromLearning(counterpartyKey: String!): LearningExemption!
	"""
	`removeLearningExemption`: let the learner work on this merchant
	again. True when an exemption existed.
	"""
	removeLearningExemption(counterpartyKey: String!): Boolean!
	"""
	`setDisplayAlias`: nickname a merchant (`COUNTERPARTY`, by name or
	normalised key; covers every spelling) or one of the caller's accounts
	(`ACCOUNT`, by id). Display only.
	"""
	setDisplayAlias(kind: DisplayAliasKind!, key: String!, alias: String!): DisplayAlias!
	"""
	`removeDisplayAlias`: the original name shows again. True when an
	alias existed.
	"""
	removeDisplayAlias(kind: DisplayAliasKind!, key: String!): Boolean!
	"""
	Declares that the offsetting transactions repay the expense ones.
	Every transaction must be the caller's, expenses negative and
	offsets positive, one currency, and none already on another link.
	"""
	createTransactionLink(input: TransactionLinkInput!): TransactionLink!
	"""
	Replaces a link's members and note wholesale.
	"""
	updateTransactionLink(id: UUID!, input: TransactionLinkInput!): TransactionLink!
	"""
	Deletes a link; the linked transactions are untouched. True when a
	link existed.
	"""
	removeTransactionLink(id: UUID!): Boolean!
	"""
	`createGoal` (iteration 4 §4).
	"""
	createGoal(input: GoalInput!): Goal!
	"""
	`updateGoal` (iteration 4 §4): read-modify-write on `finreport.goal`.
	"""
	updateGoal(id: UUID!, input: GoalInput!): Goal!
	archiveGoal(id: UUID!): Goal!
	"""
	Replaces the whole tag set; `[]` clears (§4).
	"""
	setTransactionTags(transactionId: UUID!, tags: [String!]!): Transaction!
	"""
	Overrides the category of every transaction the filter matches (and
	clears their splits). Restricted to the caller's own accounts; not
	atomic — see `BulkEditResult`.
	"""
	setTransactionsCategory(filter: TransactionFilter!, categorySlug: String!): BulkEditResult!
	"""
	Replaces the tag set of every transaction the filter matches; `[]`
	clears. Restricted to the caller's own accounts; not atomic.
	"""
	setTransactionsTags(filter: TransactionFilter!, tags: [String!]!): BulkEditResult!
	"""
	Sets the free-text note on a transaction; `null` or blank clears it.
	Commentary only: category, tags, splits and recurring are untouched
	and labelling never reads it.
	"""
	setTransactionNote(transactionId: UUID!, note: String): Transaction!
	"""
	`null` clears the override and lets auto-detection decide again
	(§4).
	"""
	setTransactionRecurring(transactionId: UUID!, recurring: Boolean): Transaction!
}

input PageInput {
	"""
	Clamped to `1..=200`.
	"""
	limit: Int! = 50
	offset: Int! = 0
}

type Query {
	"""
	Unauthenticated field (§4/§5): returns the caller's own identity, or
	`null` when there is no valid session. `AuthenticatedUser` (§4) does
	not carry `display_name` — it's loaded here with one extra query,
	the only place in the schema that needs it.
	"""
	me: Me
	accounts: [Account!]!
	transactions(filter: TransactionFilter, page: PageInput, sort: TransactionSort): TransactionPage!
	cashflowSummary(filter: TransactionFilter!, granularity: Granularity!): CashflowSummary!
	cashflowGraph(filter: TransactionFilter!, grouping: CashflowGraphInput): CashflowGraph!
	"""
	`categories` (§5): the shared tree is not tenant-scoped (§3's
	`owner_user_id` is reserved, always `NULL` this iteration) — any
	authenticated user sees the same catalog.
	"""
	categories(includeArchived: Boolean! = false): [Category!]!
	categoryBreakdown(filter: TransactionFilter!, level: Int! = 1, kind: CategoryKind): CategoryBreakdown!
	"""
	Spending per category across consecutive calendar periods of
	`filter`'s `startDate`..`endDate`, plus each period's total — one
	query for a headline trend and for "which categories drove it".
	`kind` defaults to `EXPENSE`. Same scoping and rules as
	`categoryBreakdown`, which it is built on.
	"""
	categoryComparison(filter: TransactionFilter!, granularity: Granularity! = MONTH, level: Int! = 1, kind: CategoryKind! = EXPENSE): CategoryComparison!
	"""
	`rules` (§5): like `categories`, not tenant-scoped — rules apply to
	every account the labeler sees.
	"""
	rules(state: RuleState): [Rule!]!
	"""
	`learningExemptions`: merchants the user has told the learner to
	leave alone. Like `rules`, the list itself is not tenant-scoped; the
	per-merchant name and count are computed over the caller's accounts.
	"""
	learningExemptions: [LearningExemption!]!
	"""
	`displayAliases`: the caller's own nicknames for merchants and
	accounts, each with the original name alongside.
	"""
	displayAliases: [DisplayAlias!]!
	recentlyAutoApprovedRules(limit: Int! = 20): [Rule!]!
	reviewQueue(page: PageInput): ReviewQueue!
	"""
	One link by id; `null` when it does not exist or is not the caller's.
	"""
	transactionLink(id: UUID!): TransactionLink
	"""
	The caller's links, most recently edited first.
	"""
	transactionLinks(limit: Int! = 50, offset: Int! = 0): [TransactionLink!]!
	"""
	Transactions that could be the other side of a link from
	`transactionId`, best fit first (opposite sign, similar amount,
	nearby date, not already linked). `search` widens it to the whole
	history, matching counterparty and description.
	"""
	linkCandidates(transactionId: UUID!, search: String, limit: Int! = 20): [LinkCandidate!]!
	"""
	The netted figure for the linked expenses the filter matches, kept
	apart from every period total (which still show what actually left
	the account).
	"""
	reimbursementSummary(filter: TransactionFilter): ReimbursementSummary!
	"""
	What is waiting for the user: uncategorised and held-for-review
	transactions with their worth. All-time, across the caller's accounts.
	"""
	attentionSummary: AttentionSummary!
	"""
	`heldMerchantGroups`: the held (`NEEDS_REVIEW`) transactions of the
	caller's own accounts grouped by merchant (`counterpartyKey`), largest
	group first. Held transactions with no key form one extra bucket with a
	`null` key, so the groups always sum to `heldCount`. `page` pages the
	groups, not the transactions.
	"""
	heldMerchantGroups(page: PageInput): HeldMerchantGroups!
	"""
	`tags` (§4): all tags, descending count.
	"""
	tags: [TagCount!]!
	"""
	`goals` (iteration 4 §4): the caller's own goals.
	"""
	goals(includeArchived: Boolean! = false): [Goal!]!
	goal(id: UUID!): Goal
	"""
	Window defaults to the goal's own period for FIXED, last 12 periods for RECURRING.
	"""
	goalProgress(id: UUID!, startDate: Date, endDate: Date): GoalProgress!
	"""
	The contribution rows behind a bucket, for drill-down.
	"""
	goalTransactions(id: UUID!, startDate: Date!, endDate: Date!, page: PageInput, sort: TransactionSort): TransactionPage!
	"""
	`recurringSeries` (§4).
	"""
	recurringSeries(filter: TransactionFilter): RecurringOverview!
}

enum RecurringCadence {
	MONTHLY
	QUARTERLY
	YEARLY
}

"""
`source = User` when overridden (§2.2); `seriesId` is `null` when
overridden in or out of a series.
"""
type RecurringInfo {
	isRecurring: Boolean!
	source: FlagSource!
	seriesId: UUID
	cadence: RecurringCadence
	medianAmount: Decimal
}

type RecurringOverview {
	series: [RecurringSeries!]!
	"""
	Expense series only, positive magnitude.
	"""
	totalMonthlyEquivalent: Decimal!
	currency: String!
}

type RecurringSeries {
	id: UUID!
	counterpartyKey: String!
	counterpartyName: String
	direction: Direction!
	cadence: RecurringCadence!
	"""
	Signed.
	"""
	medianAmount: Decimal!
	"""
	Signed, 4 dp (§3.2).
	"""
	monthlyEquivalent: Decimal!
	occurrenceCount: Int!
	firstDate: Date!
	lastDate: Date!
	nextExpectedDate: Date!
	"""
	`lastDate` older than cadence + grace.
	"""
	stale: Boolean!
}

"""
How a transaction list treats the offsetting side of reimbursement links
(the money that came back). Genuine income is never on that side, so
excluding reimbursements cannot hide it.
"""
enum ReimbursementFilter {
	"""
	Leave them in. The default, and what omitting the field means.
	"""
	INCLUDE
	"""
	Drop transactions that are the offsetting side of a reimbursement link.
	"""
	EXCLUDE
	"""
	Only those.
	"""
	ONLY
}

"""
The netted figure for the transactions a filter matches, kept apart from
the period totals on purpose: those keep showing the money that actually
left the account.
"""
type ReimbursementSummary {
	"""
	Sum of the magnitudes of the matched expense-side transactions.
	"""
	expenseTotal: Decimal!
	"""
	How much of that is offset by linked reimbursements, wherever and
	whenever those landed.
	"""
	reimbursed: Decimal!
	"""
	`expenseTotal - reimbursed`.
	"""
	net: Decimal!
	"""
	How many matched transactions are on a link's expense side.
	"""
	linkedCount: Int!
	"""
	How many of those are only partly offset.
	"""
	partiallyReimbursedCount: Int!
}

type ReviewQueue {
	"""
	`status = NEEDS_REVIEW`.
	"""
	transactions: [Transaction!]!
	"""
	`state = IN_REVIEW`.
	"""
	pendingRules: [Rule!]!
	totalCount: Int!
}

enum ReviewReason {
	AMBIGUOUS
	NEW_CATEGORY
}

type Rule {
	id: UUID!
	name: String!
	category: Category!
	conditions: JSON!
	priority: Int!
	state: RuleState!
	origin: RuleOrigin!
	autoApproved: Boolean!
	confidence: Float
	evidenceCount: Int!
	createdAt: DateTime!
	"""
	How many of the caller's own transactions this rule's `conditions`
	match: the rule's reach, counted over every transaction in the
	caller's accounts regardless of how it is currently labelled and
	regardless of this rule's `state`. It is NOT the number of
	transactions this rule is currently the label source for (a more
	specific or higher-priority rule, a user override or a split can
	win a transaction this rule also matches). A rule with no
	conditions matches every transaction. Evaluated by the labeler's own
	condition matcher.
	"""
	matchingTransactionCount: Int!
}

input RuleInput {
	name: String!
	categorySlug: String!
	conditions: JSON!
	priority: Int! = 0
}

enum RuleOrigin {
	USER
	LEARNED
}

enum RuleState {
	ACTIVE
	IN_REVIEW
	REVOKED
	REJECTED
}

enum ScopeCombine {
	ALL
	ANY
}

enum SortDirection {
	ASC
	DESC
}

input SplitPartInput {
	amount: Decimal!
	categorySlug: String!
}

type TagCount {
	tag: String!
	transactionCount: Int!
}

type Transaction {
	id: UUID!
	accountId: UUID!
	source: String!
	externalId: String!
	bookingDate: Date!
	valutaDate: Date
	bookingStatus: String!
	amount: Decimal!
	currency: String!
	counterpartyName: String
	counterpartyIban: String
	description: String
	transactionType: String
	"""
	Normalised counterparty (`transaction.counterparty_key`), the same key
	rule learning and recurring detection use; filter by it with
	`TransactionFilter.counterpartyKeys`. `null` until the labeler has
	normalised the row.
	"""
	counterpartyKey: String
	label: TransactionLabel
	splits: [TransactionSplit!]!
	"""
	The caller's alias for this counterparty if they set one, else
	`counterpartyName` (the bank's string, which is never overwritten).
	Prefer this over `counterpartyName` wherever a name is shown.
	"""
	counterpartyDisplayName: String
	"""
	Iteration 3 §4: sorted, `[]` when untagged.
	"""
	tags: [String!]!
	"""
	Free-text commentary the user left on the transaction; `null` when
	none. Never consulted by labelling.
	"""
	note: String
	"""
	The user-declared link this transaction is on (a reimbursement and
	the expense it repays), with the offset figures derived from the
	members' own amounts; `null` when unlinked. Lists prefetch this for a
	whole page.
	"""
	link: TransactionLink
	"""
	`null` = not an internal transfer (§4).
	"""
	transfer: TransferInfo
	"""
	Always present; `isRecurring` may be `false` (§4).
	"""
	recurring: RecurringInfo!
}

input TransactionFilter {
	"""
	Inclusive; `None` = unbounded.
	"""
	startDate: Date
	"""
	Inclusive; `None` = unbounded.
	"""
	endDate: Date
	"""
	`None`/empty = all of the caller's accounts.
	"""
	accountIds: [UUID!]
	"""
	Case-insensitive substring over `counterpartyName` + `description`.
	"""
	search: String
	"""
	`None` = both.
	"""
	direction: Direction
	"""
	Sankey drill-down: OR-ed exact matches.
	"""
	counterpartyNames: [String!]
	"""
	`false` selects the "Unknown" node's rows.
	"""
	hasCounterparty: Boolean
	"""
	Iteration 2 (§5): OR-ed; includes descendants of each slug.
	"""
	categorySlugs: [String!]
	"""
	Like `categorySlugs` but **exact**: only transactions labelled with
	one of these categories themselves (a split counts via its parts),
	never their descendants. OR-ed among themselves, AND-ed with every
	other condition. Omitted or empty = unconstrained. Used to drill into a
	parent's own "(no subcategory)" transactions.
	"""
	categorySlugsExact: [String!]
	"""
	`true` ⇒ no label at all (distinct from `needsReview`).
	"""
	uncategorized: Boolean
	needsReview: Boolean
	labelSources: [LabelSource!]
	"""
	Iteration 3 §4: AND-ed — the transaction carries all of them.
	"""
	tags: [String!]
	"""
	Matches the *effective* flag (§2.2, §4): auto unless overridden.
	"""
	recurring: Boolean
	"""
	`true` = only transfers, `false` = only non-transfers (§4).
	"""
	transfer: Boolean
	"""
	Exact transaction ids, OR-ed among themselves and AND-ed with the
	other conditions.
	"""
	transactionIds: [UUID!]
	"""
	Inclusive bound on the amount's magnitude (absolute value); `None` =
	unbounded. Use `direction` to pick income or spending.
	"""
	amountMin: Decimal
	"""
	Inclusive bound on the amount's magnitude (absolute value); `None` =
	unbounded. Use `direction` to pick income or spending.
	"""
	amountMax: Decimal
	"""
	Normalized counterparty keys (`transaction.counterparty_key`), OR-ed.
	Matches variants of one merchant that `counterpartyNames` would miss.
	Omitted or empty = unconstrained.
	"""
	counterpartyKeys: [String!]
	"""
	Whether the offsetting side of reimbursement links is included.
	`None` = `INCLUDE`: reimbursements are counted as the money they are
	until the caller asks otherwise, so no existing view changes.
	"""
	reimbursements: ReimbursementFilter
}

type TransactionLabel {
	"""
	`null` while `status = NEEDS_REVIEW`.
	"""
	category: Category
	source: LabelSource!
	rule: Rule
	confidence: Float
	status: LabelStatus!
	reviewReason: ReviewReason
	proposedCategoryPath: String
	reasoning: String
}

"""
A user-declared link and the figures derived from its members. Nothing
here is stored: all of it follows the members' current amounts.
"""
type TransactionLink {
	id: UUID!
	kind: TransactionLinkKind!
	note: String
	status: TransactionLinkStatus!
	currency: String!
	"""
	Sum of the expense members' magnitudes.
	"""
	expenseTotal: Decimal!
	"""
	Sum of the offsetting members' magnitudes.
	"""
	offsetTotal: Decimal!
	"""
	What actually offsets: the smaller of the two totals.
	"""
	reimbursed: Decimal!
	"""
	What the expense side still costs after the offset: never negative.
	"""
	net: Decimal!
	"""
	How much more came back than was paid; zero unless `status` is `OVER`.
	"""
	surplus: Decimal!
	"""
	Members that could not be found, left out of every figure above.
	"""
	missingMembers: Int!
	members: [TransactionLinkMember!]!
	updatedAt: DateTime!
}

input TransactionLinkInput {
	"""
	Defaults to `REIMBURSEMENT`.
	"""
	kind: TransactionLinkKind
	"""
	The side being offset. At least one.
	"""
	expenseIds: [UUID!]!
	"""
	The side doing the offsetting. At least one.
	"""
	offsetIds: [UUID!]!
	note: String
}

enum TransactionLinkKind {
	"""
	Money paid out, later paid back (wholly or in part) by someone else.
	"""
	REIMBURSEMENT
}

"""
One transaction in a link, with its share of the offset.
"""
type TransactionLinkMember {
	transactionId: UUID!
	role: TransactionLinkRole!
	"""
	`null` when the transaction no longer exists or is not the caller's.
	"""
	bookingDate: Date
	"""
	Signed, as on the transaction itself.
	"""
	amount: Decimal
	currency: String
	counterpartyName: String
	description: String
	"""
	For an expense: how much of it is offset. For an offset: how much of
	it goes to offsetting. A magnitude, never negative.
	"""
	allocated: Decimal!
	"""
	For an expense: what it still costs. For an offset: the part that
	offsets nothing (over-reimbursement). A magnitude.
	"""
	remaining: Decimal!
}

enum TransactionLinkRole {
	"""
	The side being offset: the bill that was paid.
	"""
	EXPENSE
	"""
	The side doing the offsetting: the money that came back.
	"""
	OFFSET
}

enum TransactionLinkStatus {
	"""
	The offsetting side exactly covers the expense side.
	"""
	FULL
	"""
	Something came back, but less than was paid.
	"""
	PARTIAL
	"""
	More came back than was paid; the excess is `surplus`.
	"""
	OVER
	"""
	A side has no member left to count (it was removed, or is not
	visible to the caller): nothing is offset.
	"""
	INCOMPLETE
}

type TransactionPage {
	items: [Transaction!]!
	totalCount: Int!
	limit: Int!
	offset: Int!
}

"""
Ordering for a transaction list. Always completed with a deterministic
tiebreaker on the transaction id, so paging through equal keys never
repeats or drops a row. Omitting it keeps the default: newest booking
date first.
"""
input TransactionSort {
	field: TransactionSortField!
	direction: SortDirection! = DESC
}

"""
The column a transaction list is ordered by.
"""
enum TransactionSortField {
	"""
	Booking date, then external id.
	"""
	BOOKING_DATE
	"""
	The **signed** amount: DESC runs largest income to largest expense.
	(Filters `amountMin`/`amountMax` bound the magnitude; sorting keeps
	the sign so income and expense do not interleave.)
	"""
	AMOUNT
	"""
	Case-insensitive counterparty name. Transactions without one sort
	last in both directions.
	"""
	COUNTERPARTY_NAME
	"""
	Case-insensitive name of the resolved category (a user override
	outranks the label). Uncategorised and split transactions (which
	have no single category) sort last in both directions.
	"""
	CATEGORY
}

type TransactionSplit {
	index: Int!
	amount: Decimal!
	category: Category!
}

"""
`counterpartTransactionId` is `null` while the other leg is not
projected yet (§4).
"""
type TransferInfo {
	counterpartTransactionId: UUID
	counterpartAccountId: UUID
	match: TransferMatch!
}

enum TransferMatch {
	IBAN
	AMOUNT_DATE
}

scalar UUID

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
