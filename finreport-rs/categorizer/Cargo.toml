[package]
name = "categorizer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }

# §2.9 provider trait + deterministic fake (WP0).
async-trait = "0.1.89"
chrono = "0.4.41"
rust_decimal = "1"
sha2 = "0.10"

# WP1: real providers + settings/logging, replacing dotenv/env_logger/config.
utils = { path = "../utils" }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0.140"
rand = "0.9.1"
tokio = { version = "1", features = ["time"] }
secrecy = { version = "0.10", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
